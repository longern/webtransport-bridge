name: test
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/bridge ./cmd/certgen
