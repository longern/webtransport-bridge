name: test
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test examples/cloudflare/index.test.mjs
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/bridge ./cmd/certgen
