services:
  bridge:
    image: ghcr.io/longern/webtransport-bridge:latest
    restart: unless-stopped
    ports:
      - "4433:4433/udp"
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
      CERT_WEBHOOK_URL: ${CERT_WEBHOOK_URL:?Set the private HTTPS webhook URL in .env}
    volumes:
      - bridge-certs:/certs
    command:
      - --public=${BRIDGE_PUBLIC:-false}
      - --backend=http://backend.example.com:8080
      - --origins=https://app.example.com
      - --paths=/public
      - --auto-cert
      - --cert-host=${BRIDGE_HOST:-}
      - --cert-dir=/certs
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]

volumes:
  bridge-certs:
